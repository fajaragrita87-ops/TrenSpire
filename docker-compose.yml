services:
  traefik:
    image: traefik:v3.5
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./docker/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./docker/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - traefik_letsencrypt:/letsencrypt
    networks:
      - web
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  minio:
    image: minio/minio:RELEASE.2025-02-07T23-21-09Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - miniodata:/data
    networks:
      - internal
      - web
    labels:
      - traefik.enable=true

      - traefik.http.routers.minio.rule=Host(`s3.${DOMAIN}`)
      - traefik.http.routers.minio.entrypoints=web
      - traefik.http.routers.minio.middlewares=redirect-to-https@file

      - traefik.http.routers.minio-sec.rule=Host(`s3.${DOMAIN}`)
      - traefik.http.routers.minio-sec.entrypoints=websecure
      - traefik.http.routers.minio-sec.tls=true
      - traefik.http.routers.minio-sec.tls.certresolver=letsencrypt
      - traefik.http.services.minio.loadbalancer.server.port=9000

      - traefik.http.routers.minio-console.rule=Host(`minio.${DOMAIN}`)
      - traefik.http.routers.minio-console.entrypoints=web
      - traefik.http.routers.minio-console.middlewares=redirect-to-https@file

      - traefik.http.routers.minio-console-sec.rule=Host(`minio.${DOMAIN}`)
      - traefik.http.routers.minio-console-sec.entrypoints=websecure
      - traefik.http.routers.minio-console-sec.tls=true
      - traefik.http.routers.minio-console-sec.tls.certresolver=letsencrypt
      - traefik.http.services.minio-console.loadbalancer.server.port=9001
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      PORT: "8080"
      DB_HOST: postgres
      DB_PORT: "5432"
      REDIS_ADDR: redis:6379
      PUBLIC_BASE_URL: https://${DOMAIN}
      MINIO_USE_SSL: "true"
      CHROME_BIN: /usr/bin/chromium
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
      - web
    labels:
      - traefik.enable=true

      - traefik.http.routers.api.rule=Host(`${DOMAIN}`) && (PathPrefix(`/api`) || PathPrefix(`/r/`) || PathPrefix(`/healthz`))
      - traefik.http.routers.api.entrypoints=web
      - traefik.http.routers.api.middlewares=redirect-to-https@file
      - traefik.http.routers.api.priority=100

      - traefik.http.routers.api-sec.rule=Host(`${DOMAIN}`) && (PathPrefix(`/api`) || PathPrefix(`/r/`) || PathPrefix(`/healthz`))
      - traefik.http.routers.api-sec.entrypoints=websecure
      - traefik.http.routers.api-sec.tls=true
      - traefik.http.routers.api-sec.tls.certresolver=letsencrypt
      - traefik.http.routers.api-sec.priority=100
      - traefik.http.services.api.loadbalancer.server.port=8080
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      DB_HOST: postgres
      DB_PORT: "5432"
      REDIS_ADDR: redis:6379
      WORKER_ANALYTICS_SCAN_SEC: ${WORKER_ANALYTICS_SCAN_SEC:-900}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["./worker"]
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      APP_ENV: production
      DB_HOST: postgres
      DB_PORT: "5432"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["./migrate"]
    restart: "no"
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_TARGET: https://${DOMAIN}
    restart: unless-stopped
    networks:
      - web
    labels:
      - traefik.enable=true

      - traefik.http.routers.frontend.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.frontend.entrypoints=web
      - traefik.http.routers.frontend.middlewares=redirect-to-https@file
      - traefik.http.routers.frontend.priority=1

      - traefik.http.routers.frontend-sec.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.frontend-sec.entrypoints=websecure
      - traefik.http.routers.frontend-sec.tls=true
      - traefik.http.routers.frontend-sec.tls.certresolver=letsencrypt
      - traefik.http.routers.frontend-sec.priority=1
      - traefik.http.services.frontend.loadbalancer.server.port=80
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  db-backup:
    build:
      context: .
      dockerfile: docker/backup/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${DB_USER}
      PGPASSWORD: ${DB_PASSWORD}
      PGDATABASE: ${DB_NAME}
      R2_BUCKET: ${R2_BUCKET}
      R2_PREFIX: ${R2_PREFIX}
      BACKUP_INTERVAL_SEC: ${BACKUP_INTERVAL_SEC:-86400}

      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_ENV_AUTH: "true"
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      RCLONE_CONFIG_R2_ENDPOINT: ${R2_ENDPOINT}
      RCLONE_CONFIG_R2_ACL: private
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  pgdata:
  redisdata:
  miniodata:
  traefik_letsencrypt:

networks:
  web:
  internal:
